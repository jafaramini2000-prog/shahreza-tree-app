name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html app.js styles.css manifest.json sw.js icon.svg www/

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add location permissions
        run: |
          python3 -c "from pathlib import Path; p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text(); m='<application'; perms='<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n'; p.write_text(s if 'ACCESS_FINE_LOCATION' in s else s.replace(m,perms+m))"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Configure release signing and version
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, os, re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ANDROID_STORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in s:
              s = s.replace("    buildTypes {", signing + "\n    buildTypes {", 1)

          s = s.replace(
              "        release {",
              "        release {\n            signingConfig signingConfigs.release",
              1
          )

          build_number = int(os.environ["BUILD_NUMBER"])
          s = re.sub(
              r"versionCode\s+\d+",
              f"versionCode {build_number}",
              s,
              count=1
          )

          try:
              version_name = json.loads(
                  Path("package.json").read_text()
              ).get("version", "0.3.0")
          except Exception:
              version_name = "0.3.0"

          s = re.sub(
              r'versionName\s+"[^"]+"',
              f'versionName "{version_name}"',
              s,
              count=1
          )

          p.write_text(s)
          PY

      - name: Build signed release APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../ShahrezaTreeSurvey.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShahrezaTreeSurvey-APK
          path: ShahrezaTreeSurvey.apk
          if-no-files-found: error
