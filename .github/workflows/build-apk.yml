name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html app.js styles.css manifest.json sw.js icon.svg www/

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add location permissions
        run: |
          python3 -c "from pathlib import Path; p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text(); m='<application'; perms='<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n'; p.write_text(s if 'ACCESS_FINE_LOCATION' in s else s.replace(m,perms+m))"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ShahrezaTreeSurvey.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShahrezaTreeSurvey-APK
          path: ShahrezaTreeSurvey.apk
          if-no-files-found: error
